<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAW FILADELFIA — Estudio de práctica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1b1d21;
    --panel: #24262b;
    --panel-raised: #2e3138;
    --groove: #17181b;
    --brass: #c89b3c;
    --brass-dim: #8a6f30;
    --teal: #4f8880;
    --text: #ede8de;
    --text-dim: #8b8d93;
    --mute-red: #b4463c;
    --solo-amber: #d9a441;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(200,155,60,0.05), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(79,136,128,0.06), transparent 45%);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    padding: 28px 16px 60px;
  }

  .rack{ max-width: 960px; margin: 0 auto; }

  header{
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 12px;
    border-bottom: 1px solid #34363c;
    padding-bottom: 18px;
    margin-bottom: 22px;
  }

  .wordmark{
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(28px, 5vw, 40px);
    letter-spacing: 0.5px;
    color: var(--text);
    cursor: pointer;
  }
  .wordmark span{ color: var(--brass); font-style: italic; font-weight: 400; }

  .subtitle{
    color: var(--text-dim);
    font-size: 12.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .back-btn{
    background: var(--panel);
    border: 1px solid #3a3c43;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 8px 12px;
    border-radius: 4px;
    cursor: pointer;
    display: none;
  }
  .back-btn:hover{ color: var(--brass); border-color: var(--brass); }
  .back-btn.visible{ display: inline-block; }

  #catalogScreen .status{ color: var(--text-dim); font-size: 12px; margin-bottom: 14px; }

  .song-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }

  .song-card{
    background: var(--panel);
    border: 1px solid #35373d;
    border-radius: 8px;
    padding: 18px 16px;
    cursor: pointer;
    transition: border-color .15s ease, transform .1s ease;
  }
  .song-card:hover{ border-color: var(--brass); transform: translateY(-1px); }
  .song-card .num{ color: var(--brass); font-size: 11px; letter-spacing: 0.05em; }
  .song-card .title{ font-family: 'Fraunces', serif; font-size: 19px; margin-top: 6px; color: var(--text); }
  .song-card .meta{ color: var(--text-dim); font-size: 11px; margin-top: 8px; }

  .transport{
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--panel);
    border: 1px solid #34363c;
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 26px;
    flex-wrap: wrap;
  }

  .transport-btn{
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid #46484f;
    background: var(--panel-raised);
    color: var(--text);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    transition: border-color .15s ease, transform .1s ease;
  }
  .transport-btn:hover{ border-color: var(--brass); }
  .transport-btn:active{ transform: scale(0.94); }
  .transport-btn.play{ background: var(--brass); color: #1b1d21; border-color: var(--brass); }

  .timecode{ font-size: 14px; letter-spacing: 0.04em; color: var(--brass); min-width: 96px; }

  .seekbar{
    flex: 1; min-width: 160px; height: 6px;
    background: var(--groove); border-radius: 3px;
    position: relative; cursor: pointer; overflow: hidden;
  }
  .seekbar-fill{
    position: absolute; left:0; top:0; bottom:0; width: 0%;
    background: linear-gradient(90deg, var(--teal), var(--brass));
  }

  .status{ font-size: 11.5px; color: var(--text-dim); letter-spacing: 0.04em; }

  .console{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
    gap: 10px;
    background: var(--groove);
    border-radius: 10px;
    padding: 16px 12px 20px;
    border: 1px solid #303237;
  }

  .strip{
    background: var(--panel);
    border: 1px solid #35373d;
    border-radius: 8px;
    padding: 12px 8px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .strip .led{
    width: 8px; height: 8px; border-radius: 50%;
    background: #3a3c42;
    transition: background .1s ease, box-shadow .1s ease;
  }
  .strip.sounding .led{ background: var(--teal); box-shadow: 0 0 6px 1px rgba(79,136,128,0.8); }

  .strip .track-name{
    font-size: 11px; text-align: center; color: var(--text);
    letter-spacing: 0.02em; min-height: 28px;
    display: flex; align-items: center; justify-content: center;
  }

  .fader-track{ width: 34px; height: 150px; position: relative; display: flex; align-items: center; justify-content: center; }
  .fader-track::before{
    content:""; position: absolute; left: 50%; top: 6px; bottom: 6px; width: 3px;
    background: var(--groove); transform: translateX(-50%); border-radius: 2px;
  }

  input[type="range"].fader{
    -webkit-appearance: none; appearance: none;
    width: 150px; height: 28px; background: transparent;
    transform: rotate(-90deg); margin: 0; cursor: pointer;
  }
  input[type="range"].fader::-webkit-slider-runnable-track{ height: 3px; background: transparent; }
  input[type="range"].fader::-webkit-slider-thumb{
    -webkit-appearance: none; width: 34px; height: 16px; border-radius: 3px;
    background: linear-gradient(180deg, #d8c079, var(--brass) 45%, var(--brass-dim));
    border: 1px solid #7a5f28; box-shadow: 0 1px 2px rgba(0,0,0,0.5); margin-top: -6.5px;
  }
  input[type="range"].fader::-moz-range-track{ height: 3px; background: transparent; }
  input[type="range"].fader::-moz-range-thumb{
    width: 34px; height: 16px; border-radius: 3px;
    background: linear-gradient(180deg, #d8c079, var(--brass) 45%, var(--brass-dim));
    border: 1px solid #7a5f28;
  }

  .btn-row{ display: flex; gap: 6px; }

  .toggle{
    width: 28px; height: 22px; border-radius: 4px;
    border: 1px solid #46484f; background: var(--panel-raised); color: var(--text-dim);
    font-size: 10px; font-weight: 600; letter-spacing: 0.02em; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .toggle.mute.active{ background: var(--mute-red); color: #fff; border-color: var(--mute-red); }
  .toggle.solo.active{ background: var(--solo-amber); color: #1b1d21; border-color: var(--solo-amber); }

  footer{ margin-top: 26px; color: var(--text-dim); font-size: 11px; text-align: center; letter-spacing: 0.03em; }

  .hidden{ display: none !important; }
</style>
</head>
<body>

<div class="rack">

  <header>
    <div>
      <div class="wordmark" id="wordmark">DAW <span>Filadelfia</span></div>
      <div class="subtitle" id="headerSubtitle">Estudio de práctica &middot; elige una canción</div>
    </div>
    <button class="back-btn" id="backBtn">&larr; Volver al catálogo</button>
  </header>

  <div id="catalogScreen">
    <div class="status" id="catalogStatus">Cargando catálogo de canciones…</div>
    <div class="song-grid" id="songGrid"></div>
  </div>

  <div id="playerScreen" class="hidden">
    <div class="transport">
      <button class="transport-btn play" id="playBtn" title="Reproducir / Pausar">▶</button>
      <button class="transport-btn" id="stopBtn" title="Detener">■</button>
      <div class="timecode" id="timecode">00:00 / 00:00</div>
      <div class="seekbar" id="seekbar"><div class="seekbar-fill" id="seekFill"></div></div>
      <div class="status" id="status">Cargando pistas…</div>
    </div>
    <div class="console" id="console"></div>
  </div>

  <footer>DAW FILADELFIA — el catálogo y las pistas se leen desde tu almacenamiento externo (CATALOG_URL en el código).</footer>
</div>

<script>
/* =========================================================================
   CONFIGURACIÓN
   -------------------------------------------------------------------------
   CATALOG_URL debe apuntar a un archivo "catalog.json" que subes a la raíz
   de tu bucket (Backblaze B2, R2, etc). Ese archivo lista TODAS tus
   canciones en una sola línea cada una. Formato esperado:

   [
     {
       "title": "Mi esperanza está en Dios",
       "folder": "Secuencias/Mi esperanza está en Dios",
       "pistas": 11,
       "inicio": 0,
       "ext": ".wav",
       "nombres": ["Voz principal","Coros","Drums","Bass","Guitarra",
                   "Teclado","Percusión","Synth","Otros","Guía","Click"]
     }
   ]

   - "pistas": cuántos archivos tiene esa canción.
   - "inicio": el número con el que empieza el primer archivo (0 o 1). Si lo
     omites, se asume 1.
   - "ext": extensión de los archivos de ESA canción (".wav", ".mp3"...). Si
     la omites, se usa la extensión global FILE_EXT de abajo.
   - "nombres": (opcional) lista de nombres bonitos para mostrar en pantalla,
     en el mismo orden que las pistas. Si la omites, se muestran como
     "Pista 1", "Pista 2", etc.

   Dentro de cada carpeta, los archivos deben llamarse de forma consecutiva
   con el prefijo definido en FILE_PREFIX: pista-0, pista-1, pista-2...
   (o el número de inicio que hayas puesto).

   Si CATALOG_URL queda vacío (""), el reproductor usa un catálogo de
   demostración local para que puedas probar el funcionamiento mientras
   conectas tu bucket real.
   ========================================================================= */
const CATALOG_URL = ""; // ejemplo: "https://f005.backblazeb2.com/file/tu-bucket/catalog.json"
const FILE_PREFIX = "pista-";   // cómo nombras tus archivos: pista-0.wav, pista-1.wav...
const FILE_EXT = ".mp3";        // extensión por defecto si la canción no define "ext"

const DEMO_CATALOG = [
  { title: "Ejemplo — Ensayo 1", folder: null, demo: true }
];

const DEMO_TRACKS = [
  { name: "Pista guía (voz)",       url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
  { name: "Piano / acompañamiento", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
  { name: "Base rítmica",           url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
  { name: "Coro",                   url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" }
];

/* ========================================================================= */

const els = {
  catalogScreen: document.getElementById('catalogScreen'),
  catalogStatus: document.getElementById('catalogStatus'),
  songGrid: document.getElementById('songGrid'),
  playerScreen: document.getElementById('playerScreen'),
  backBtn: document.getElementById('backBtn'),
  wordmark: document.getElementById('wordmark'),
  headerSubtitle: document.getElementById('headerSubtitle'),
  console: document.getElementById('console'),
  playBtn: document.getElementById('playBtn'),
  stopBtn: document.getElementById('stopBtn'),
  timecode: document.getElementById('timecode'),
  seekbar: document.getElementById('seekbar'),
  seekFill: document.getElementById('seekFill'),
  status: document.getElementById('status')
};

let audioCtx = null;
let buffers = [];
let gainNodes = [];
let sources = [];
let strips = [];
let trackState = [];

let isPlaying = false;
let startedAtCtxTime = 0;
let offset = 0;
let duration = 0;
let rafId = null;

function encodePath(path){
  // codifica cada segmento de una ruta (separada por "/") sin tocar las barras
  return path.split('/').map(encodeURIComponent).join('/');
}

function fmt(t){
  if(!isFinite(t)) t = 0;
  const m = Math.floor(t/60).toString().padStart(2,'0');
  const s = Math.floor(t%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

/* ---------------------- PANTALLA 1: CATÁLOGO ---------------------- */

async function loadCatalog(){
  showCatalogScreen();
  els.catalogStatus.textContent = 'Cargando catálogo de canciones…';
  els.songGrid.innerHTML = '';

  let catalog = DEMO_CATALOG;
  if(CATALOG_URL){
    try{
      const res = await fetch(CATALOG_URL);
      catalog = await res.json();
      els.catalogStatus.textContent = `${catalog.length} canción(es) disponibles`;
    }catch(err){
      console.error(err);
      els.catalogStatus.textContent = 'No se pudo leer el catálogo remoto — mostrando demo.';
      catalog = DEMO_CATALOG;
    }
  }else{
    els.catalogStatus.textContent = 'Modo demostración (define CATALOG_URL en el código para conectar tu bucket).';
  }

  catalog.forEach((song, i)=>{
    const card = document.createElement('div');
    card.className = 'song-card';
    card.innerHTML = `
      <div class="num">${(i+1).toString().padStart(2,'0')}</div>
      <div class="title">${song.title}</div>
      <div class="meta">${song.demo ? 'pistas de demostración' : 'toca para abrir las pistas'}</div>
    `;
    card.addEventListener('click', ()=> openSong(song));
    els.songGrid.appendChild(card);
  });
}

function showCatalogScreen(){
  els.catalogScreen.classList.remove('hidden');
  els.playerScreen.classList.add('hidden');
  els.backBtn.classList.remove('visible');
  els.headerSubtitle.textContent = 'Estudio de práctica · elige una canción';
  stopPlayback();
}

/* ---------------------- PANTALLA 2: REPRODUCTOR ---------------------- */

async function openSong(song){
  els.catalogScreen.classList.add('hidden');
  els.playerScreen.classList.remove('hidden');
  els.backBtn.classList.add('visible');
  els.headerSubtitle.textContent = song.title;
  els.console.innerHTML = '';
  els.status.textContent = 'Cargando pistas…';

  let trackList;
  if(song.demo){
    trackList = DEMO_TRACKS;
  }else{
    const folderUrl = CATALOG_URL.replace('catalog.json', '') + encodePath(song.folder) + '/';
    const count = song.pistas || 0;
    const start = (song.inicio !== undefined) ? song.inicio : 1;
    const ext = song.ext || FILE_EXT;
    trackList = [];
    for(let i = start; i < start + count; i++){
      const idx = i - start;
      const label = (song.nombres && song.nombres[idx]) ? song.nombres[idx] : `Pista ${i}`;
      trackList.push({ name: label, url: `${folderUrl}${FILE_PREFIX}${i}${ext}` });
    }
  }

  await loadTracks(trackList);
}

async function loadTracks(trackList){
  buffers = []; gainNodes = []; strips = []; trackState = [];
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  try{
    const loaded = await Promise.all(trackList.map(async (t)=>{
      const res = await fetch(t.url);
      const arr = await res.arrayBuffer();
      return audioCtx.decodeAudioData(arr);
    }));

    buffers = loaded;
    duration = Math.max(...buffers.map(b=>b.duration));

    trackList.forEach((t, i)=>{
      const gain = audioCtx.createGain();
      gain.gain.value = 1;
      gain.connect(audioCtx.destination);
      gainNodes.push(gain);
      trackState.push({ muted:false, solo:false, volume:1 });
      strips.push(renderStrip(t.name, i));
    });

    els.status.textContent = `${trackList.length} pistas listas`;
    updateTimecode(0);
  }catch(err){
    console.error(err);
    els.status.textContent = 'No se pudieron cargar las pistas (revisa las URLs)';
  }
}

function renderStrip(name, i){
  const strip = document.createElement('div');
  strip.className = 'strip';
  strip.innerHTML = `
    <div class="led"></div>
    <div class="track-name">${name}</div>
    <div class="fader-track"><input type="range" class="fader" min="0" max="1" step="0.01" value="1"></div>
    <div class="btn-row">
      <button class="toggle mute" title="Silenciar">M</button>
      <button class="toggle solo" title="Solo">S</button>
    </div>
  `;
  els.console.appendChild(strip);

  const fader = strip.querySelector('.fader');
  const muteBtn = strip.querySelector('.mute');
  const soloBtn = strip.querySelector('.solo');

  fader.addEventListener('input', ()=>{
    trackState[i].volume = parseFloat(fader.value);
    applyGains();
  });
  muteBtn.addEventListener('click', ()=>{
    trackState[i].muted = !trackState[i].muted;
    muteBtn.classList.toggle('active', trackState[i].muted);
    applyGains();
  });
  soloBtn.addEventListener('click', ()=>{
    trackState[i].solo = !trackState[i].solo;
    soloBtn.classList.toggle('active', trackState[i].solo);
    applyGains();
  });

  return strip;
}

function applyGains(){
  const anySolo = trackState.some(t=>t.solo);
  trackState.forEach((t, i)=>{
    let effective = t.volume;
    if(t.muted) effective = 0;
    if(anySolo && !t.solo) effective = 0;
    if(gainNodes[i]) gainNodes[i].gain.value = effective;
    if(strips[i]) strips[i].classList.toggle('sounding', effective > 0.01 && isPlaying);
  });
}

function startPlayback(fromOffset){
  sources.forEach(s=>{ try{ s.stop(); }catch(e){} });
  sources = buffers.map((buf, i)=>{
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(gainNodes[i]);
    src.start(0, fromOffset);
    return src;
  });
  startedAtCtxTime = audioCtx.currentTime;
  offset = fromOffset;
  isPlaying = true;
  els.playBtn.textContent = '❚❚';
  applyGains();
  tick();
}

function pausePlayback(){
  offset = getCurrentTime();
  sources.forEach(s=>{ try{ s.stop(); }catch(e){} });
  sources = [];
  isPlaying = false;
  els.playBtn.textContent = '▶';
  applyGains();
  if(rafId) cancelAnimationFrame(rafId);
}

function stopPlayback(){
  sources.forEach(s=>{ try{ s.stop(); }catch(e){} });
  sources = [];
  isPlaying = false;
  offset = 0;
  if(els.playBtn) els.playBtn.textContent = '▶';
  applyGains();
  if(rafId) cancelAnimationFrame(rafId);
  updateTimecode(0);
}

function getCurrentTime(){
  if(!isPlaying) return offset;
  return offset + (audioCtx.currentTime - startedAtCtxTime);
}

function updateTimecode(t){
  els.timecode.textContent = `${fmt(t)} / ${fmt(duration)}`;
  const pct = duration ? Math.min(100, (t/duration)*100) : 0;
  els.seekFill.style.width = pct + '%';
}

function tick(){
  const t = getCurrentTime();
  updateTimecode(t);
  if(t >= duration){
    stopPlayback();
    return;
  }
  rafId = requestAnimationFrame(tick);
}

els.playBtn.addEventListener('click', ()=>{
  if(!buffers.length) return;
  if(isPlaying){ pausePlayback(); }
  else{ startPlayback(offset >= duration ? 0 : offset); }
});

els.stopBtn.addEventListener('click', stopPlayback);

els.seekbar.addEventListener('click', (e)=>{
  if(!duration) return;
  const rect = els.seekbar.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  const newTime = Math.max(0, Math.min(duration, pct*duration));
  if(isPlaying){ startPlayback(newTime); }
  else{ offset = newTime; updateTimecode(newTime); }
});

els.backBtn.addEventListener('click', showCatalogScreen);
els.wordmark.addEventListener('click', showCatalogScreen);

loadCatalog();
</script>

</body>
</html>
